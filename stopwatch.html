<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch App </title>
    <style>
        body{
            background-color: aqua;
            background-image: url(infinitywar.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            
        }
        .stopwatch{
            width: 90%;
            max-width: 600px;
            background-image: linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.8)),url(background.png);
            background-size: cover;
            background-position: center;
            text-align: center;
            color: white;
            margin: 200px auto 0;
            height: 90vh;
        }
        .stopwatch h1{
            font-weight: 300;
            font-size: 64px;
            margin-top: 60px;
        }
        .buttons {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .buttons img{
            width: 50px;
            margin: 0 20px;
            cursor: pointer;


        }
        .buttons img :nth-child(2){
            width: 80px;
        }
    </style>
</head>
<body>
  <div class="stopwatch">
    <h1> Rishi's Stopwatch</h1>
    <h1 id="displayTime">00:00:00</h1>
    <div class="buttons">
        <img src="stop.png" alt="stop" onclick="watchStop()">
        <img src="start.png" alt="start" onclick="watchStart()">
        <img src="reset.png" alt="reset" onclick="watchReset()">
        
        
    </div>
  </div>  
  <script>

    let [seconds,minutes,hours]=;
    let displayTime = document.getElementById("displayTime");
    let timer=null;

    function stopwatch(){
        seconds++;
        if(seconds == 60){
            seconds =0
            minutes++;
            if (minutes == 60){
                minutes = 0
                hours++;
            }
        }

        let h = hours < 10 ? "0" + hours : hours;
        let m = minutes < 10 ? "0" + minutes : minutes;
        let s = seconds < 10 ? "0" + seconds : seconds;

        displayTime.innerHTML = h + ":" + m + ":" + s;
    }

    function watchStart(){
        if(timer !== null)
        {
            clearInterval(timer);
        }
        timer = setInterval(stopwatch,1000);
    }

    function watchStop(){
        clearInterval(timer);
        timer = null;
    }

    function watchReset(){
        clearInterval(timer);
        timer = null;
        [seconds,minutes,hours] =;
        displayTime.innerHTML = "00:00:00";
    }
  </script>
</body>
</html>
